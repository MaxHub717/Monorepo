name: nexgen-prod
# Load this file together with docker/compose.base.yml:
# docker compose -f docker/compose.base.yml -f docker/compose.prod.yml up --build

services:
  db:
    env_file:
      - ../.env.docker
    environment:
      POSTGRES_DB: nexgen_esport
    volumes:
      - postgres-data-prod:/var/lib/postgresql/data
    networks:
      - nexgen

  redis:
    volumes:
      - redis-data-prod:/data
    networks:
      - nexgen

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
      target: prod
      args:
        NODE_VERSION: "24.16.0"
        PNPM_VERSION: "9.15.0"
    env_file:
      - ../.env.docker
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/nexgen_esport
      REDIS_URL: redis://redis:6379
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - nexgen

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
      target: prod
      args:
        NODE_VERSION: "24.16.0"
        PNPM_VERSION: "9.15.0"
    env_file:
      - ../.env.docker
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_BASE_URL: http://api:3000/api/v1
    ports:
      - "3001:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - nexgen

  adminer:
    image: adminer:4.8.1
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - nexgen

volumes:
  postgres-data-prod:
  redis-data-prod:
